services:
  - type: web
    name: sales-forecasting
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: python backend_minimal.py
    envVars:
      - key: PORT
        value: 8000
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
